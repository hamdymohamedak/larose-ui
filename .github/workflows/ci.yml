name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Framework neutrality
        run: pnpm check:framework-neutrality

      - name: Storybook coverage
        run: pnpm generate:storybook-parity && pnpm check:storybook-coverage

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @larose-ui/sandbox-e2e run install:browsers

      - name: Cross-framework parity E2E
        run: pnpm test:parity

      - name: Build
        run: pnpm build

      - name: Visual regression
        run: pnpm visual-regression

      - name: laRose doctor
        run: pnpm run doctor:ci

      - name: Doctor JSON report
        run: pnpm run doctor:json > doctor-report.json

      - name: Verify npm publish readiness
        run: pnpm verify:publish

      - name: Accessibility audit
        run: pnpm a11y
