name: Deploy docs to Cloudflare Pages

# Full agent-ready hosting (origin /robots.txt, Link headers, Markdown negotiation).
# Requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets.
# Optional vars: DOCS_SITE_URL, CLOUDFLARE_PAGES_PROJECT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'scripts/generate-docs-catalog.mjs'
      - 'scripts/lib/agent-ready.mjs'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs-cloudflare.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve site URL
        id: site
        run: |
          echo "url=${DOCS_SITE_URL:-https://larose-ui.pages.dev}" >> "$GITHUB_OUTPUT"
          echo "project=${CF_PROJECT:-larose-ui-docs}" >> "$GITHUB_OUTPUT"
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Build docs at site root (agent-ready /robots.txt)
        run: pnpm --filter @larose-ui/docs build
        env:
          VITE_BASE_PATH: /
          DOCS_SITE_URL: ${{ steps.site.outputs.url }}

      - name: Publish to Cloudflare Pages
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name "${{ steps.site.outputs.project }}" \
            --commit-dirty=true
