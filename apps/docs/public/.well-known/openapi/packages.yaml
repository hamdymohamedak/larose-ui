openapi: 3.1.0
info:
  title: laRose UI Packages API
  version: 1.0.0
  description: Package catalog for the laRose UI monorepo.
servers:
  - url: https://hamdymohamedak.github.io/larose-ui
paths:
  /docs/packages:
    get:
      operationId: listPackages
      summary: Human-readable package index
      responses:
        '200':
          description: Package documentation index
          content:
            text/html:
              schema:
                type: string
  /docs/packages/{packageId}:
    get:
      operationId: getPackageDocs
      summary: Package documentation page
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: string
            enum:
              - accessibility
              - ai-core
              - ai-react
              - ai-svelte
              - ai-vue
              - cli
              - component-logic
              - contracts
              - core
              - data-core
              - data-react
              - data-svelte
              - data-vue
              - devtools-core
              - devtools-react
              - devtools-svelte
              - devtools-vue
              - enterprise-core
              - enterprise-react
              - enterprise-svelte
              - enterprise-vue
              - forms-core
              - forms-react
              - forms-svelte
              - forms-vue
              - liquid-glass-core
              - migration
              - network
              - next
              - nuxt
              - observability-core
              - observability-react
              - observability-svelte
              - observability-vue
              - offline
              - permissions-core
              - permissions-react
              - permissions-svelte
              - permissions-vue
              - primitives
              - quality-core
              - react
              - runtime-core
              - runtime-react
              - runtime-svelte
              - runtime-vue
              - styles
              - svelte
              - sveltekit
              - testing-core
              - testing-react
              - testing-svelte
              - testing-vue
              - themes
              - tokens
              - vue
      responses:
        '200':
          description: Package documentation page
          content:
            text/html:
              schema:
                type: string
